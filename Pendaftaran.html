<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pendaftaran Peserta</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f8ff;
            margin: 20px;
        }
        h1{
            color:#1a56b0;
            text-align: center;
        }
        form{
            background: white;
            border: 1px solid #ddd;
            padding:10px;
            margin-button:10px;
        }
        input[type="text"]{
            width:140px;
        }
        button{
            background:#1a56b0;
            color: white;
            padding: 5px 12px;
            cursor: pointer;
        }
        table{
            border-collapse: collapse;
            width:100%;
        }
        th{
            background:#1a56b0;
            color: white;
            padding:6px;
            text-align: center;
        }
        td{
            border:1px solid #ccd;
            padding: 6px;
        }
        .aktif{
            background:#e6eefb;
        }
    </style>
    </head>

    <body>
        <h1>Pendaftaran Peserta</h1>

        <!---Form pendaftaran peserta -->
        <form action="#" method="post">
        Nama:
        <input type="text" name="nama" value="Budi Santoso"><br>
        Jenis Kelamin:
        <input type="radio" name="jk" value="L" checked>L
        <input type="radio" name="jk" value="P">P<br>
        Jurusan:
        <select name="jurusan">
            <option>Informatika</option>
            <option>Sistem Informasi</option>
        </select><br><br>
        <button type="submit">Kirim</button>
        </form>
         <!--Tabel data peserta -->
        <table>
            <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Jurusan</th>
            </tr>
            <tr class="aktif">
                <td>1</td>
                <td>Budi Santoso</td>
                <td>Informatika</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Sari Wulandari</td>
                <td>Sistem Informasi</td>
            </tr>
        </table>
    </body>
    </html>
